    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Midnight Star Chart Journal - 3am</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header class="header">
            <h1>The Midnight Journal</h1>
            <p>Click any star to read a 3am thought.</p>
        </header>

        <main class="canvas"></main>
        
        <div class="shooting-star" style="top: 20%; left: 80%; animation-delay: 1s;"></div>
        <div class="shooting-star" style="top: 10%; left: 40%; animation-delay: 3s;"></div>
        
        <div class="shooting-star" style="top: 15%; left: 0%; animation-delay: 1.5s;"></div>
        <div class="shooting-star" style="top: 5%; left: -20%; animation-delay: 2.5s;"></div>
        
        <div class="shooting-star" style="top: 30%; left: 10%; animation-delay: 2s;"></div>
        <div class="shooting-star" style="top: 15%; left: -40%; animation-delay: 3.5s;"></div>

        <div class="shooting-star" style="top: 10%; left: 20%; animation-delay: 2.2s;"></div>
        <div class="shooting-star" style="top: 45%; left: 30%; animation-delay: 3.2s;"></div>

        <form action="" id="star-form" class="bottom-bar">
            <input type="text" id="title" placeholder="Enter a Title" maxlength="25" required>
            <input type="text" id="thought" placeholder="Enter a Midnight Thought" required>
            <button type="submit">Submit Star ⭐</button>
        </form>

        <div id="thought-mod" class="modal hidden">
            <div class="modal-card">
                <button id="close" class="close-btn">❌</button>
                <span id="date" class="date-tag"></span>
                <h2 id="modal-title"></h2>
                <p id="modal-desc"></p>
                <button id="delete" class="delete-btn">Delete The Star</button>
            </div>
        </div>
    <script src="script.js"></script>
    </body>
    </html>
