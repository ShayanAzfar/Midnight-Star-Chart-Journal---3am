    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Midnight Star Chart Journal - 3am</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header class="header">
            <h1>The Midnight Journal</h1>
            <p>Click any star to read a 3am thought.</p>
        </header>

        <main class="canvas"></main>

        <form action="" id="star-form" class="bottom-bar">
            <input type="text" id="title" placeholder="Enter your Star Title" maxlength="25" required>
            <input type="text" id="thought" placeholder="Enter your Midnight Thought" required>
            <button type="submit">Submit Star ⭐</button>
        </form>

        <div id="star" class="modal hidden">
            <div class="modal-card">
                <button id="close" class="close-btn">❌</button>
                <span id="date" class="date-tag"></span>
                <h2 id="modal-title"></h2>
                <p id="modal-desc"></p>
                <button id="delete" class="delete-btn">Delete The Star</button>
            </div>
        </div>
    <script src="script.js"></script>
    </body>
    </html>
